<body>
<div class="desktop">
  <button class="shortcut" id="reopen" type="button">
    <span class="shortcut-icon" aria-hidden="true">🎀</span>
    <span>쥬니어 KO 월드</span>
  </button>

  <section class="window" id="explorer" tabindex="-1" aria-labelledby="window-title">
    <header class="titlebar">
      <span class="titlebar-icon" aria-hidden="true">🎀</span>
      <h1 id="window-title">쥬니어 KO 월드</h1>
      <div class="titlebar-buttons">
        <button type="button" data-hide aria-label="최소화">_</button>
        <button type="button" disabled aria-label="최대화">□</button>
        <button type="button" data-hide aria-label="닫기">×</button>
      </div>
    </header>

    <nav class="menubar" aria-label="메뉴">
      <span>파일(F)</span><span>편집(E)</span><span>보기(V)</span><span>즐겨찾기(A)</span><span>도움말(H)</span>
    </nav>

    <div class="addressbar">
      <span class="address-label">주소(D)</span>
      <span class="address-field"><span aria-hidden="true">🎡</span> C:\놀이동산\미니게임</span>
    </div>

    <div class="panes">
      <aside class="sidebar">
        <div class="side-box">
          <h2>놀이터 작업</h2>
          <p class="side-hello">오늘은 뭐 하고 놀까? <span aria-hidden="true">♡</span></p>
        </div>
        <div class="side-box" id="details">
          <h2>자세히</h2>
          <p class="details-name" id="details-name">미니게임 4개</p>
          <p class="details-desc" id="details-desc">아이콘을 두 번 누르면 실행돼요.</p>
          <a class="open-btn" id="details-open" hidden>열기 ▶</a>
        </div>
      </aside>

      <ul class="files" id="files">
        <li>
          <a class="file" href="https://jellodev.github.io/koti-com/" data-desc="매일 부려먹는 내 AI, 알고 보니 무슨 타입? 프롬프트 하나로 까보는 AI 전용 MBTI.">
            <span class="file-icon" style="--tile: #c9b8ff" aria-hidden="true">📺</span>
            <span class="file-name">KOTI<wbr>.exe</span>
          </a>
        </li>
        <li>
          <a class="file" href="https://jellodev.github.io/save-me-com/" data-desc="AI가 세상을 접수하는 날, 너는 살아남을 수 있을까? 최근 일주일 AI 사용 이력으로 재판받기.">
            <span class="file-icon" style="--tile: #ffb3c7" aria-hidden="true">⚖️</span>
            <span class="file-name">살려주세요<wbr>.exe</span>
          </a>
        </li>
        <li>
          <a class="file" href="https://jellodev.github.io/online-budda-beading/" data-desc="염주 108알. 할 수 있다. 아마도. 바늘 하나로 108번뇌를 꿰는 가장 억울한 수행 게임.">
            <span class="file-icon" style="--tile: #ffe08a" aria-hidden="true">📿</span>
            <span class="file-name">108번뇌꿰기<wbr>.exe</span>
          </a>
        </li>
        <li>
          <a class="file" href="https://jellodev.github.io/flat-challenge/" data-desc="한 방울도 흘리지 말고, 잔 위로 볼록하게. 할 수 있을까?">
            <span class="file-icon" style="--tile: #b8e0ff" aria-hidden="true">🥛</span>
            <span class="file-name">찰랑찰랑<wbr>.exe</span>
          </a>
        </li>
      </ul>
    </div>

    <footer class="statusbar">
      <span id="status">개체 4개</span>
      <span>🎀 내 놀이터</span>
    </footer>
  </section>
</div>

<div class="taskbar">
  <span class="start"><span aria-hidden="true">🎀</span> 시작</span>
  <button class="task" id="task" type="button" aria-pressed="true"><span aria-hidden="true">🎡</span> 쥬니어 KO 월드</button>
  <a class="tray" href="https://github.com/jellodev" aria-label="jellodev GitHub"><span class="tray-name">jellodev ♡ </span><time id="clock"></time></a>
</div>
